<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department of Information Technology</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
            background-color: #f4f7f9;
            color: #222;
        }

        header {
            background-color: #123b5d;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background-color: #0b2940;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px;
            background-color: white;
        }

        section {
            margin-bottom: 35px;
        }

        h2 {
            color: #123b5d;
        }

        .lab-image {
            width: 100%;
            max-width: 800px;
            height: 350px;
            object-fit: cover;
            display: block;
            margin: 20px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #1a5d12;
            color: white;
        }

        form {
            max-width: 600px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 130px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #123b5d;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d5d8d;
        }

        footer {
            background-color: #123b5d;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
